<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Methodolab — Coming soon">
    <title>Methodo-Lab</title>
    <link rel="icon" type="image/png" href="logos/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        .logo-wrap {
            margin-bottom: 3rem;
            opacity: 0.85;
        }
        .logo-wrap img {
            height: 36px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            margin-bottom: 1.25rem;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.05;
            color: #ffffff;
            text-align: center;
            max-width: 680px;
            margin-bottom: 1.5rem;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 300;
            color: rgba(255,255,255,0.5);
            text-align: center;
            max-width: 420px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.18);
            margin-bottom: 2.5rem;
        }

        .contact {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            text-align: center;
        }
        .contact a {
            color: rgba(255,255,255,0.6);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s;
        }
        .contact a:hover { color: #fff; }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.18);
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>

    <div class="logo-wrap">
        <img src="logos/logo.png" alt="Methodolab">
    </div>

    <p class="label">Social Methodology Lab · Chile</p>

    <h1>Under Construction</h1>

    <p class="subtitle">
        We're rebuilding. Come back soon —<br>
        big things are on the way.
    </p>

    <div class="divider"></div>

    <p class="contact">
        In the meantime, reach us at
        <a href="mailto:hello@methodolab.com">hello@methodolab.com</a>
    </p>

    <footer>© 2025 Methodolab</footer>

</body>
</html>
